[project]
name = "opencv-python"
version = "99.0.0"
description = "Compatibility stub: redirects the 'opencv-python' requirement to the headless build so the app needs no GUI system libraries (libGL / libgthread) on Streamlit Cloud."
dependencies = ["opencv-python-headless==4.10.0.84"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
